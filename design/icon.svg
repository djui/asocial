<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231a45"/>
      <stop offset="0.55" stop-color="#110d22"/>
      <stop offset="1" stop-color="#06050b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0.42"/>
      <stop offset="0.65" stop-color="#ff4d6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcd6f5"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e72"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <!-- the glyph, with a band cut out where the slash crosses -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <line x1="250" y1="794" x2="794" y2="250" stroke="#000" stroke-width="150" stroke-linecap="round"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <rect width="1024" height="1024" fill="url(#glow2)"/>
  <g mask="url(#cut)" fill="url(#glyph)">
    <path fill-rule="evenodd" d="M470 302a258 258 0 1 0 0.1 0Zm0 116a142 142 0 1 1-0.1 0Z"/>
    <rect x="612" y="330" width="116" height="446" rx="58"/>
  </g>
  <line x1="250" y1="794" x2="794" y2="250" stroke="#ff2e72" stroke-opacity="0.55" stroke-width="80" stroke-linecap="round" filter="url(#shadow)"/>
  <line x1="250" y1="794" x2="794" y2="250" stroke="url(#slash)" stroke-width="78" stroke-linecap="round"/>
</svg>
