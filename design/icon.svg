<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1638"/>
      <stop offset="1" stop-color="#07070c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ff604d" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ff604d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d6e"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- geometric lowercase a -->
  <circle cx="470" cy="560" r="200" fill="none" stroke="#f5f3ff" stroke-width="116"/>
  <rect x="612" y="342" width="116" height="434" rx="58" fill="#f5f3ff"/>
  <!-- the "no" slash, cut out of the glyph -->
  <line x1="236" y1="808" x2="808" y2="236" stroke="#0e0c18" stroke-width="150" stroke-linecap="round"/>
  <line x1="236" y1="808" x2="808" y2="236" stroke="url(#slash)" stroke-width="78" stroke-linecap="round"/>
</svg>
