name: Asocial
options:
  bundleIdPrefix: com.djui
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 8DR8DB9W22
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Asocial:
    type: application
    platform: iOS
    sources:
      - Asocial
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djui.asocial
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Asocial
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Lets you take a photo or video when you post or send a message."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Lets you record audio when you film a video to post or send."
  AsocialTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AsocialTests
    dependencies:
      - target: Asocial
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djui.asocial.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Asocial.app/Asocial"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Asocial:
    build:
      targets:
        Asocial: all
    test:
      targets:
        - AsocialTests
